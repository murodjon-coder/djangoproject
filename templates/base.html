<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fotostudiya{% endblock %} | Fotostudiya</title>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'photostudio:photo_list' %}">Fotostudiya</a>
        <nav>
            <a href="{% url 'photostudio:photo_list' %}">Suratlar (FBV)</a>
            <a href="{% url 'photostudio:photo_list_cbv' %}">Suratlar (CBV)</a>
            <a href="{% url 'photostudio:photo_create' %}">+ Surat qo'shish</a>
        </nav>
    </header>
    <main class="container">
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="message message-{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
