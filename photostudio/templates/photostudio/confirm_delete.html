{% extends 'base.html' %}

{% block title %}O'chirish{% endblock %}

{% block content %}
<div class="form-shell">
    <div class="form-card">
        <span class="badge badge-cancelled">Diqqat</span>
        <h1 style="margin-top: 14px;">O'chirishni tasdiqlang</h1>
        <p>Rostdan ham <strong>“{{ object }}”</strong> ni o'chirmoqchimisiz? Bu amalni ortga qaytarib bo'lmaydi.</p>
        {% if warning %}<p class="notice danger">{{ warning }}</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn-danger">Ha, o'chirish</button>
                <a class="btn btn-ghost" href="{{ cancel_url }}">Bekor qilish</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
