{% extends 'base.html' %}

{% block title %}O'chirish{% endblock %}

{% block content %}
<div class="form-card">
    <h1>O'chirishni tasdiqlang</h1>
    <p>Rostdan ham <strong>“{{ object }}”</strong> ni o'chirmoqchimisiz? Bu amalni ortga qaytarib bo'lmaydi.</p>
    {% if warning %}<p class="notice">{{ warning }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="button-danger">Ha, o'chirish</button>
            <a class="button button-secondary" href="{{ cancel_url }}">Bekor qilish</a>
        </div>
    </form>
</div>
{% endblock %}
