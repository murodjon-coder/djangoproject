{% extends 'base.html' %}

{% block title %}Surat qo'shish{% endblock %}

{% block content %}
<h1>Yangi surat qo'shish</h1>

{# 11-hafta: fayl yuborish uchun enctype="multipart/form-data" shart #}
<form method="post" enctype="multipart/form-data" class="form-card" novalidate>
    {% csrf_token %}

        <button type="submit">Saqlash</button>
        <a class="button button-secondary" href="{% url 'photostudio:photo_list' %}">Bekor qilish</a>
    </div>
</form>
{% endblock %}
